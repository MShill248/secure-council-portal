<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Secure Council Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
    </script>
  <script defer src="./assets/resetPassword.js"></script>
</head>
<body class="bg-light">

  <div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow p-4" style="max-width: 450px; width: 100%;">
      <h2 class="text-center mb-3">Reset Your Password</h2>
      <p class="text-muted text-center">Enter your username to receive an OTP by email.</p>

      <div id="requestOtpSection">
        <div class="form-floating mb-3">
          <input type="text" id="usernameInput" class="form-control" placeholder="Username">
          <label for="usernameInput">Username</label>
        </div>
        <button id="sendOtpBtn" class="btn btn-primary w-100">Send OTP</button>
      </div>

      <div id="resetSection" class="d-none">
        <div class="form-floating mb-3">
          <input type="text" id="otpInput" class="form-control" placeholder="Enter OTP">
          <label for="otpInput">OTP Code</label>
        </div>
        <div class="form-floating mb-3">
          <input type="password" id="newPasswordInput" class="form-control" placeholder="New Password">
          <label for="newPasswordInput">New Password</label>
        </div>
        <div class="form-floating mb-3">
          <input type="password" id="confirmPasswordInput" class="form-control" placeholder="Confirm Password">
          <label for="confirmPasswordInput">Confirm Password</label>
        </div>
        <button id="resetPasswordBtn" class="btn btn-success w-100">Reset Password</button>
      </div>

      <div class="text-center mt-3">
        <a href="index.html">Back to Login</a>
      </div>
    </div>
  </div>
</body>
</html>
