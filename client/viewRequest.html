    <link rel="stylesheet" href="./styling/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>
    <script defer src="./assets/viewRequests.js"></script>
</head>

<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="maindashboard.html">SCP</a>

            <div class="d-flex align-items-center gap-2">
                <!-- ACCOUNT BUTTON -->
                <button class="btn btn-link text-light p-0" type="button" data-bs-toggle="offcanvas"
                    data-bs-target="#offcanvasAccount" aria-controls="offcanvasAccount" aria-label="Open account menu">
                    <i class="bi bi-person-fill fs-3"></i>
                </button>

                <!-- MAIN MENU BUTTON -->
                <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas"
                    data-bs-target="#offcanvasMainMenu" aria-controls="offcanvasMainMenu" aria-label="Open main menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>

            <!-- ACCOUNT OFFCANVAS -->
            <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="offcanvasAccount"
                aria-labelledby="offcanvasAccountLabel">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="offcanvasAccountLabel">
                        <i class="bi bi-person me-2"></i>Account
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                        aria-label="Close"></button>
                </div>

                <div class="offcanvas-body d-flex flex-column" data-bs-theme="dark">
                    <div class="list-group list-group-flush">
                        <a href="accountpage.html"
                            class="list-group-item list-group-item-action d-flex align-items-center rounded-3 mb-2">
                            <i class="bi bi-person me-2"></i> Account</a>
                        <a href="#"
                            class="list-group-item list-group-item-action d-flex align-items-center rounded-3 mb-2">
                            <i class="bi bi-key me-2"></i> Change Password</a>
                        <a href="#"
                            class="list-group-item list-group-item-action d-flex align-items-center rounded-3 mb-2">
                            <i class="bi bi-envelope me-2"></i> Change Email</a>
                    </div>

                    <div class="mt-auto pt-3">
                        <a class="list-group-item list-group-item-action d-flex align-items-center rounded-3 text-danger"
                            href="index.html">
                            <i class="bi bi-box-arrow-right me-2"></i> Log out</a>
                    </div>
                </div>
            </div>

            <!-- MAIN MENU OFFCANVAS -->
            <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="offcanvasMainMenu"
                aria-labelledby="offcanvasMainMenuLabel">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="offcanvasMainMenuLabel">
                        <i class="bi bi-list me-2"></i>Menu
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                        aria-label="Close"></button>
                </div>
                <div class="offcanvas-body" data-bs-theme="dark">
                    <div class="list-group list-group-flush">
                        <a href="requestForm.html"
                            class="list-group-item list-group-item-action d-flex align-items-center rounded-3 mb-2">
                            <i class="bi bi-plus-circle me-2"></i> Create Request
                        </a>
                        <a href="requestdashboard.html"
                            class="list-group-item list-group-item-action d-flex align-items-center rounded-3 mb-2">
                            <i class="bi bi-speedometer2 me-2"></i> My Dashboard
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="container my-4 flex-grow-1">
        <h1 class="text-center mb-4">View Request (Council User)</h1>

        <form id="viewrequest" class="viewrequest" novalidate>

            <div class="mx-auto" style="max-width: 900px;">

                <div class="mb-3">
                    <label for="residentName" class="form-label">Name of resident (sender)</label>
                    <input id="residentName" class="form-control" type="text" readonly
                        placeholder="Resident full name" />
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-8">
                        <label for="residentAddress" class="form-label">Address</label>
                        <input id="residentAddress" class="form-control" type="text" readonly
                            placeholder="Resident address" />
                    </div>
                    <div class="col-md-4">
                        <label for="residentPhone" class="form-label">Phone Number</label>
                        <input id="residentPhone" class="form-control" type="text" readonly
                            placeholder="Phone number" />
                    </div>
                </div>

                <div class="mb-3">
                    <label for="requestDescription" class="form-label">Request:</label>
                    <textarea id="requestDescription" class="form-control" rows="6" readonly
                        placeholder="Full request details"></textarea>
                </div>

                <div class="d-flex justify-content-between align-items-start">
                    <div class="mb-4 flex-grow-1">
                        <label for="councilMessage" class="form-label">Message:</label>
                        <textarea id="councilMessage" class="form-control w-50" rows="3"
                            placeholder="Enter message"></textarea>
                    </div>

                    <div class="col-md-3">
                        <label for="Priority" class="form-label">Priority level</label>
                        <select id="Priority" name="Priority" class="form-select" required>
                            <option value="" selected disabled>Select</option>
                            <option value="High">High</option>
                            <option value="Medium">Medium</option>
                            <option value="High">Low</option>
                        </select>
                        <div class="invalid-feedback">
                            Please choose a priority level for this request.
                        </div>
                    </div>
                </div>


                <div class="d-flex justify-content-center mb-3">
                    <label class="d-flex align-items-center border rounded px-3 py-2 small-box">
                        <input class="form-check-input me-2 custom-checkbox" type="checkbox">
                        Has this request been resolved?
                    </label>
                </div>

            </div>
        </form>
        </div>
        <div class="d-flex gap-3 justify-content-center">
            <button id="cancelBtn" type="button" class="btn btn-outline-secondary">Cancel</button>
            <button id="submitBtn" type="button" class="btn btn-success">Submit</button>
        </div>

        </div>
    </main>




    <footer class="footer bg-dark text-light p-4 mt-auto">
        <div class="container text-center">
            <small>&copy; 2025 Secure Council Portal. All rights reserved.</small>
        </div>
    </footer>

</body>

</html>
