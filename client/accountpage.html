<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>
    <script defer src="./assets/accountpage.js"></script>
</head>

<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="maindashboard.html">SCP</a>

            <div class="d-flex align-items-center gap-2">
                <!-- ACCOUNT BUTTON -->
                <button class="btn btn-link text-light p-0" type="button" data-bs-toggle="offcanvas"
                    data-bs-target="#offcanvasAccount" aria-controls="offcanvasAccount" aria-label="Open account menu">
                    <i class="bi bi-person-fill fs-3"></i>
                </button>

                <!-- MAIN MENU BUTTON -->
                <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas"
                    data-bs-target="#offcanvasMainMenu" aria-controls="offcanvasMainMenu" aria-label="Open main menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>

            <!-- ACCOUNT OFFCANVAS -->
            <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="offcanvasAccount"
                aria-labelledby="offcanvasAccountLabel">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="offcanvasAccountLabel">
                        <i class="bi bi-person me-2"></i>Account
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                        aria-label="Close"></button>
                </div>

                <div class="offcanvas-body d-flex flex-column" data-bs-theme="dark">
                    <div class="list-group list-group-flush">
                        <a href="accountpage.html"
                            class="list-group-item list-group-item-action d-flex align-items-center rounded-3 mb-2">
                            <i class="bi bi-person me-2"></i> Account</a>
                        <a href="#"
                            class="list-group-item list-group-item-action d-flex align-items-center rounded-3 mb-2">
                            <i class="bi bi-key me-2"></i> Change Password</a>
                        <a href="#"
                            class="list-group-item list-group-item-action d-flex align-items-center rounded-3 mb-2">
                            <i class="bi bi-envelope me-2"></i> Change Email</a>
                    </div>

                    <div class="mt-auto pt-3">
                        <a class="list-group-item list-group-item-action d-flex align-items-center rounded-3 text-danger"
                            href="index.html">
                            <i class="bi bi-box-arrow-right me-2"></i> Log out</a>
                    </div>
                </div>
            </div>

            <!-- MAIN MENU OFFCANVAS -->
            <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="offcanvasMainMenu"
                aria-labelledby="offcanvasMainMenuLabel">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="offcanvasMainMenuLabel">
                        <i class="bi bi-list me-2"></i>Menu
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                        aria-label="Close"></button>
                </div>
                <div class="offcanvas-body" data-bs-theme="dark">
                    <div class="list-group list-group-flush">
                        <a href="requestForm.html"
                            class="list-group-item list-group-item-action d-flex align-items-center rounded-3 mb-2">
                            <i class="bi bi-plus-circle me-2"></i> Create Request
                        </a>
                        <a href="requestdashboard.html"
                            class="list-group-item list-group-item-action d-flex align-items-center rounded-3 mb-2">
                            <i class="bi bi-speedometer2 me-2"></i> My Dashboard
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main>
        <h1 class="text-center">Your SCP Account</h1>
        <div class="container">
            <form id="account-form" class="account-form" novalidate>
                <div class="row">
                    <div class="col-md-8 mb-5">
                        <div class="card shadow-sm rounded">
                            <div class="card-body">
                                <div class="p-2">

                                    <div class="row mb-5">
                                        <div class="col">
                                            <label class="form-label">First name</label>
                                            <input type="text" class="form-control" id="firstName" name="firstName"
                                                readonly>
                                        </div>
                                        <div class="col">
                                            <label class="form-label">Last name</label>
                                            <input type="text" class="form-control" id="lastName" name="lastName"
                                                readonly>
                                        </div>
                                    </div>

                                    <div class="row mb-5">
                                        <div class="col">
                                            <label class="form-label">Username</label>
                                            <div class="input-group">
                                                <span class="input-group-text">@</span>
                                                <input type="text" class="form-control" id="username" name="username"
                                                    readonly>
                                            </div>
                                        </div>
                                        <div class="col">
                                            <label class="form-label">Date of Birth</label>
                                            <input type="date" class="form-control" id="dob" name="dob" readonly>
                                        </div>
                                    </div>

                                    <div class="mb-4">
                                        <label class="form-label">Email Address</label>
                                        <input type="text" class="form-control" id="Email Address" name="Email Address"
                                            readonly>
                                    </div>

                                    <div class="mb-4">
                                        <label class="form-label">Address</label>
                                        <input type="text" class="form-control" id="address" name="address" readonly>
                                    </div>

                                    <div class="mb-4 d-flex justify-content-center gap-3">
                                        <button type="button" class="btn btn-danger btn-sm">Delete</button>
                                        <button type="button" class="btn btn-success btn-sm">Edit Details</button>
                                    </div>

                                </div>
                            </div>
                        </div>
                    </div>


                    <div class="col-md-4 mb-5 text-center">
                        <div class="card shadow-sm rounded">
                            <div class="card-body">

                                <div class="mb-5">
                                    <i class="bi bi-person-circle" style="font-size: 10rem;"></i>
                                </div>

                                <div class="mb-5">
                                    <label class="form-label">Postcode</label>
                                    <input type="text" class="form-control" id="postcode" name="postcode" readonly>
                                </div>
                                <div class="dropdown">
                                    <button class="btn btn-primary dropdown-toggle" type="button" data-toggle="dropdown">Dropdown Example
                                    <span class="caret"></span></button>
                                    <ul class="dropdown-menu">
                                        <datalist id="datalistOptions">
                                            <option value="Barking & Dagenham">
                                            <option value="Barnet">
                                            <option value="Bexley">
                                            <option value="Brent">
                                            <option value="Bromley">
                                            <option value="Camden">
                                            <option value="Croydon">
                                            <option value="Ealing">
                                            <option value="Enfield">
                                            <option value="Greenwich">
                                            <option value="Hackney">
                                            <option value="Hammersmith & Fulham">
                                            <option value="Haringey">
                                            <option value="Harrow">
                                            <option value="Havering">
                                            <option value="Hillingdon">
                                            <option value="Hounslow">
                                            <option value="Islington">
                                            <option value="Kensington & Chelsea">
                                            <option value="Kingston Upon Thames">
                                            <option value="Lambeth">
                                            <option value="Lewisham">
                                            <option value="Merton">
                                            <option value="Newham">
                                            <option value="Redbridge">
                                            <option value="Richmond Upon Thames">
                                            <option value="Southwark">
                                            <option value="Sutton">
                                            <option value="Tower Hamlets">
                                            <option value="Waltham Forest">
                                            <option value="Wandsworth">
                                            <option value="Westminster">
                                        </datalist>
                                </div>
                            </div>
                        </div>
            </form>
        </div>
    </main>
