<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>
    <script defer src="./assets/accountpage.js"></script>
</head>

<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">SCP</a>
            <div class="d-flex align-items-center">
                <div class="dropdown me-2">
                    <a class="text-light text-decoration-none dropdown-toggle" href="#" role="button" id="userDropdown"
                        data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-fill fs-3"></i>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                        <li>
                            <h6 class="dropdown-header">Account Management</h6>
                        </li>
                        <li><a class="dropdown-item" href="accountpage.html"><i class="bi bi-person"></i>MyAccount</a>
                        </li>
                        <li><a class="dropdown-item" href="#"><i class="bi bi-key"></i>Change Password</a></li>
                        <li><a class="dropdown-item" href="#"><i class="bi bi-envelope"></i>Change Email</a></li>
                        <li><a class="dropdown-item" href="#"></i>Log Out</a>
                        </li>
                    </ul>
                </div>
                <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas"
                    data-bs-target="#offcanvasDarkNavbar" aria-controls="offcanvasDarkNavbar"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>
            <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="offcanvasDarkNavbar"
                aria-labelledby="offcanvasDarkNavbarLabel">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="offcanvasDarkNavbarLabel">SCP Menu</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                        aria-label="Close"></button>
                </div>
                <div class="offcanvas-body">
                    <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">Create Request</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="maindashboard.html">My Dashboard</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="accountpage.html">Account Management</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <main>
        <h1 class="text-center">Your SCP Account</h1>
        <div class="container">
            <form id="account-form" class="account-form" novalidate>
                <div class="row">
                    <div class="col-md-8 mb-5">
                        <div class="card shadow-sm rounded">
                            <div class="card-body">
                                <div class="p-2">

                                    <div class="row mb-5">
                                        <div class="col">
                                            <label class="form-label">First name</label>
                                            <input type="text" class="form-control" id="firstName" name="firstName" readonly>
                                        </div>
                                        <div class="col">
                                            <label class="form-label">Last name</label>
                                            <input type="text" class="form-control" id="lastName" name="lastName" readonly>
                                        </div>
                                    </div>

                                    <div class="row mb-5">
                                        <div class="col">
                                            <label class="form-label">Username</label>
                                            <div class="input-group">
                                                <span class="input-group-text">@</span>
                                                <input type="text" class="form-control" id="username" name="username" readonly>
                                            </div>
                                        </div>
                                        <div class="col">
                                            <label class="form-label">Date of Birth</label>
                                            <input type="date" class="form-control" id="dob" name="dob" readonly>
                                        </div>
                                    </div>

                                    <div class="mb-4">
                                        <label class="form-label">Email Address</label>
                                        <input type="text" class="form-control" id="Email Address" name="Email Address" readonly>
                                    </div>

                                    <div class="mb-4">
                                        <label class="form-label">Address</label>
                                        <input type="text" class="form-control" id="address" name="address" readonly>
                                    </div>

                                    <div class="mb-4 d-flex justify-content-center gap-3">
                                        <button type="button" class="btn btn-danger btn-sm">Delete</button>
                                        <button type="button" class="btn btn-success btn-sm">Edit Details</button>
                                    </div>

                                </div>
                            </div>
                        </div>
                    </div>


                    <div class="col-md-4 mb-5 text-center">
                        <div class="card shadow-sm rounded">
                            <div class="card-body">

                                <div class="mb-5">
                                    <i class="bi bi-person-circle" style="font-size: 10rem;"></i>
                                </div>

                                <div class="mb-5">
                                    <label class="form-label">Postcode</label>
                                    <input type="text" class="form-control" id="postcode" name="postcode">
                                </div>
                                <div class="mb-5">
                                    <label class="form-label">Borough</label>
                                    <input type="text" class="form-control" id="borough" name="borough" readonly>
                                </div>
                            </div>
                        </div>
            </form>
        </div>
    </main>
