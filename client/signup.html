<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="./styling/index.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>
    <script defer src="./assets/signup.js"></script>
</head>

<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">SCP</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas"
                data-bs-target="#offcanvasDarkNavbar" aria-controls="offcanvasDarkNavbar"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="offcanvasDarkNavbar"
                aria-labelledby="offcanvasDarkNavbarLabel">

                <div class="offcanvas-body">
                    <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="index.html">Sign In</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Help</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Contact Us</a>
                        </li>

                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <main>
        <h1 class="text-center mb-4">Create Your Account</h1>
        <div class="container">
            <form id="signup-form" class="signup-form" novalidate>
                <div class="row">
                    <!-- FIRST COLUMN WITH USER'S PERSONAL DETAILS -->
                    <div class="col-md-8 mb-3">

                        <div class="container d-flex justify-content-center align-items-top">
                            <div class="card shadow-sm rounded">
                                <div class="card-body">
                                    <div class="mb-3">
                                        <label class="form-label">First name</label>
                                        <input type="text" class="form-control" id="firstName" name="firstName"
                                            placeholder="Enter your First name">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Last name</label>
                                        <input type="text" class="form-control" id="lastName" name="lastName"
                                            placeholder="Enter your Last name">
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">Email</label>
                                        <input type="email" class="form-control" id="email" name="email"
                                            placeholder="Enter your Email">
                                    </div>

                                    <label class="form-label">Username</label>
                                    <div class="input-group mb-3">
                                        <span class="input-group-text" id="basic-addon1">@</span>
                                        <input type="text" class="form-control" id="username" name="username"
                                            placeholder="Username" aria-label="Username"
                                            aria-describedby="basic-addon1">
                                    </div>

                                    <label for="inputPassword5" class="form-label">Password</label>
                                    <input type="password" id="password" name="password" class="form-control"
                                        aria-describedby="passwordHelpBlock">
                                    <div id="passwordHelpBlock" class="form-text">
                                        Your password must be 8-20 characters long, contain letters and numbers, and
                                        must not
                                        contain
                                        spaces, special characters, or emoji.
                                    </div>

                                    <label for="inputPassword5" class="form-label">Re-enter Password</label>
                                    <input type="password" id="rePassword" name="rePassword" class="form-control">

                                    <div class="text-center">
                                        <p>Already have an account?<a style="text-decoration: none" href="index.html">
                                                Log In</a></p>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                    <!-- SECOND COLUMN WITH USER'S ADDRESS DETAILS -->
                    <div class="col-md-4 mb-3">
                        <div class="container d-flex justify-content-center align-items-top">
                            <div class="card shadow- sm rounded">
                                <div class="card-body">

                                    <div class="mb-3">
                                        <label for="dob" class="form-label">DOB</label>
                                        <input type="date" id="dob" name="dob" class="form-control" required>
                                    </div>

                                    <div class="mb-3">
                                        <label for="address" class="form-label">Address</label>
                                        <input type="text" id="address" name="address" class="form-control" required>
                                    </div>

                                    <div class="mb-3">
                                        <label for="postcode" class="form-label">Postcode</label>
                                        <input type="text" id="postcode" name="postcode" class="form-control" required>
                                    </div>

                                    <div class="mb-3">
                                        <label for="boroughs" class="form-label">Borough</label>
                                        <input class="form-control" list="datalistOptions" id="boroughs" name="boroughs"
                                            placeholder="Type to search...">
                                        <datalist id="datalistOptions">
                                            <option value="Barking & Dagenham">
                                            <option value="Barnet">
                                            <option value="Bexley">
                                            <option value="Brent">
                                            <option value="Bromley">
                                            <option value="Camden">
                                            <option value="Croydon">
                                            <option value="Ealing">
                                            <option value="Enfield">
                                            <option value="Greenwich">
                                            <option value="Hackney">
                                            <option value="Hammersmith & Fulham">
                                            <option value="Haringey">
                                            <option value="Harrow">
                                            <option value="Havering">
                                            <option value="Hillingdon">
                                            <option value="Hounslow">
                                            <option value="Islington">
                                            <option value="Kensington & Chelsea">
                                            <option value="Kingston Upon Thames">
                                            <option value="Lambeth">
                                            <option value="Lewisham">
                                            <option value="Merton">
                                            <option value="Newham">
                                            <option value="Redbridge">
                                            <option value="Richmond Upon Thames">
                                            <option value="Southwark">
                                            <option value="Sutton">
                                            <option value="Tower Hamlets">
                                            <option value="Waltham Forest">
                                            <option value="Wandsworth">
                                            <option value="Westminster">
                                        </datalist>
                                    </div>

                                    <div class="mb-3">
                                        <label for="phone" class="form-label">Phone Number</label>
                                        <input type="tel" id="phone" name="phone" class="form-control" required>
                                    </div>

                                    <div class="mb-3">
                                        <label for="userrole" class="form-label">Role</label>
                                        <select id="userrole" name="userrole" class="form-control" required>
                                            <option value="">Select role</option>
                                            <option value="council">Council Staff</option>
                                            <option value="resident">Resident</option>
                                        </select>
                                    </div>
                                    <button type="submit" class="btn btn-primary w-100">Sign Up</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </main>
